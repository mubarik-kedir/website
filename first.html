<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Unordered List</h1>
    <ul style="list-style-type: square;">
        <li>cofee</li>
        <li>tea</li>
        <li>milk</li>
    </ul>
    <h1>Ordered List</h1>
    <ol start="4">
        <li>cofee</li>
        <li>tea
            <ol type="a">
                <li>black tea</li>
                <li>green tea</li>
            </ol>
        </li>
        <li>milk</li>
    </ol>


</body>
</html>
